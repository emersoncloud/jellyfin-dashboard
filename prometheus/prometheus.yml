global:
  scrape_interval: 10s
  scrape_timeout: 8s

scrape_configs:
  - job_name: jellyfin
    static_configs:
      - targets: ["jellyfin-exporter:9711"]

  # node-exporter runs with host networking so it sees the real NICs.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
